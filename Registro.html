<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C & D Distribuira Mayorista - Registro de Clientes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="marca">
                C & D Distribuidora Mayorista
            </a>
            <nav>   
                <a href="index.html">Volver al Catálogo</a>
                <a href="Registro.html" class="activo">Crear Cuenta</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <h2 class="titulo-seccion">Registro de Clientes y Usuarios</h2>
        
        <div id="contenedor_formulario">
            <form id="formularioCliente" novalidate style="width: 100%;">
                
                <!-- RUT -->
                <div class="campo">
                    <label for="rut">RUT Cliente:</label>
                    <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-9" autocomplete="off" required>
                    <small class="pista">Sin puntos y con guión (Ejemplo: 76123456-7)</small>
                    <span class="mensaje_error" id="errorRut"></span>
                </div>

                <!-- Nombre y Apellido -->
                <div class="fila-doble">
                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" autocomplete="given-name" required>
                        <span class="mensaje_error" id="errorNombre"></span>
                    </div>
                    <div class="campo">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez González" autocomplete="family-name" required>
                        <span class="mensaje_error" id="errorApellido"></span>
                    </div>
                </div>

                <!-- Usuario -->
                <div class="campo">
                    <label for="usuario">Nombre de Usuario (Login):</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej: claudia" autocomplete="username" required>
                    <small class="pista">Mínimo 4 caracteres alfanuméricos.</small>
                    <span class="mensaje_error" id="errorUsuario"></span>
                </div>

                <!-- Correo -->
                <div class="campo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="cliente@email.cl" autocomplete="email" required>
                    <span class="mensaje_error" id="errorEmail"></span>
                </div>

                <!-- Telefono -->
                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+56912345678" autocomplete="tel" required>
                    <small class="pista">9 números o formato con prefijo +569.</small>
                    <span class="mensaje_error" id="errorTelefono"></span>
                </div>

                <!-- Direccion -->
                <div class="campo">
                    <label for="direccion">Dirección de Despacho:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Calle, número, departamento" autocomplete="street-address" required>
                    <span class="mensaje_error" id="errorDireccion"></span>
                </div>

                <!-- Comuna -->
                <div class="campo">
                    <label for="comuna">Comuna de Entrega:</label>
                    <input list="listaComunas" id="comuna" name="comuna" placeholder="Escribe o selecciona tu comuna">
                    <datalist id="listaComunas">
                        <option value="Maipú">
                        <option value="Santiago">
                        <option value="Providencia">
                        <option value="Cerrillos">
                        <option value="Valparaíso">
                        <option value="Concepción">
                    </datalist>
                    <span class="mensaje_error" id="errorComuna"></span>
                </div>

                <!-- Password y Confirmación -->
                <div class="fila-doble">
                    <div class="campo">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                        <span class="mensaje_error" id="errorPassword"></span>
                    </div>
                    <div class="campo">
                        <label for="confirmPassword">Confirmar Contraseña:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
                        <span class="mensaje_error" id="errorConfirmPassword"></span>
                    </div>
                </div>

              

                <button type="submit" id="btnGuardar" class="btn-enviar">Guardar y Registrar Cliente</button>
                
                <div id="mensajeExito" class="alerta-exito"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>Proyecto Comercio - Registro de Clientes | Duoc UC</p>
    </footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("formularioCliente");

        // Funciones dedicadas para consola y feedback visual
        function funcionError(campo, mensaje, idSpan) {
            console.log(`-- Función error: [${campo}] --`);
            console.error(`Error en ${campo}: ${mensaje}`);

            const span = document.getElementById(idSpan);
            if (span) span.textContent = mensaje;
        }

        function funcionCorrecto(campo, valor) {
            console.log(`-- Función validación: [${campo}] --`);
            console.log(`%c ${campo} ingresado correctamente: ${valor}`, "color: #28a745; font-weight: bold;");
        }

        function funcionExito(datos) {
            console.log("-- Función éxito: registro completado --");
            console.table(datos);

            const alerta = document.getElementById("mensajeExito");
            alerta.textContent = `¡Registro completado con éxito! Bienvenido(a) ${datos.Nombre}.`;
            alerta.style.display = "block";
            form.reset();
        }

        function limpiarErrores() {
            document.querySelectorAll(".mensaje_error").forEach((el) => (el.textContent = ""));
            const alerta = document.getElementById("mensajeExito");
            alerta.textContent = "";
            alerta.style.display = "none";
        }

        // Listener del submit
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            limpiarErrores();

            let esValido = true;

            const rut = document.getElementById("rut");
            const nombre = document.getElementById("nombre");
            const apellido = document.getElementById("apellido");
            const usuario = document.getElementById("usuario");
            const email = document.getElementById("email");
            const telefono = document.getElementById("telefono");
            const direccion = document.getElementById("direccion");
            const comuna = document.getElementById("comuna");
            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirmPassword");

            // RUT
            const regexRut = /^[0-9]{7,8}-[0-9kK]{1}$/;
            if (!regexRut.test(rut.value.trim())) {
                funcionError("RUT Cliente", "Ingresa un RUT válido sin puntos y con guion (ej: 12345678-9).", "errorRut");
                esValido = false;
            } else {
                funcionCorrecto("RUT Cliente", rut.value.trim());
            }

            // Nombre
            if (nombre.value.trim().length < 2) {
                funcionError("Nombre", "Ingresa un nombre válido (mínimo 2 caracteres).", "errorNombre");
                esValido = false;
            } else {
                funcionCorrecto("Nombre", nombre.value.trim());
            }

            // Apellido
            if (apellido.value.trim().length < 2) {
                funcionError("Apellido", "Ingresa un apellido válido (mínimo 2 caracteres).", "errorApellido");
                esValido = false;
            } else {
                funcionCorrecto("Apellido", apellido.value.trim());
            }

            // Usuario
            if (usuario.value.trim().length < 4) {
                funcionError("Usuario", "El usuario debe tener al menos 4 caracteres.", "errorUsuario");
                esValido = false;
            } else {
                funcionCorrecto("Usuario", usuario.value.trim());
            }

            // Correo
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!regexEmail.test(email.value.trim())) {
                funcionError("Correo Electrónico", "Ingresa un correo válido (ej: cliente@email.cl).", "errorEmail");
                esValido = false;
            } else {
                funcionCorrecto("Correo Electrónico", email.value.trim());
            }

            // Teléfono
            const regexTel = /^(\+?56)?(\s?)(0?9)(\s?)[0-9]{8}$|^[0-9]{9}$/;
            if (!regexTel.test(telefono.value.trim())) {
                funcionError("Teléfono", "Ingresa un teléfono de 9 números o con formato +569.", "errorTelefono");
                esValido = false;
            } else {
                funcionCorrecto("Teléfono", telefono.value.trim());
            }

            // Dirección
            if (direccion.value.trim().length < 5) {
                funcionError("Dirección", "La dirección de entrega es requerida (mínimo 5 caracteres).", "errorDireccion");
                esValido = false;
            } else {
                funcionCorrecto("Dirección", direccion.value.trim());
            }

            // Comuna
            if (comuna.value.trim() === "") {
                funcionError("Comuna", "Selecciona o escribe una comuna.", "errorComuna");
                esValido = false;
            } else {
                funcionCorrecto("Comuna", comuna.value.trim());
            }

            // Contraseñas
            let passOk = true;
            if (password.value.length < 6) {
                funcionError("Contraseña", "La contraseña debe tener mínimo 6 caracteres.", "errorPassword");
                esValido = false;
                passOk = false;
            }
            if (password.value !== confirmPassword.value || confirmPassword.value === "") {
                funcionError("Confirmar Contraseña", "Las contraseñas no coinciden.", "errorConfirmPassword");
                esValido = false;
                passOk = false;
            }
            if (passOk) {
                funcionCorrecto("Contraseña", "****** (válida)");
            }


        });
    });
</script>
